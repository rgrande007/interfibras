<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072524"/>
      <stop offset="55%" stop-color="#0c3330"/>
      <stop offset="100%" stop-color="#0f2a4a"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3BAEC4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3BAEC4" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#3BAEC4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#692BBA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#692BBA" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#692BBA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ABFB2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8ABFB2" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#8ABFB2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3BAEC4"/>
      <stop offset="100%" stop-color="#692BBA"/>
    </linearGradient>
    <radialGradient id="orb1" cx="25%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#3BAEC4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3BAEC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="78%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#692BBA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#692BBA" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur40">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Orbs -->
  <ellipse cx="300" cy="283" rx="340" ry="340" fill="url(#orb1)" filter="url(#blur40)"/>
  <ellipse cx="936" cy="347" rx="280" ry="280" fill="url(#orb2)" filter="url(#blur40)"/>

  <!-- Fiber filaments -->
  <path d="M-20 310 Q200 280 420 315 Q640 350 860 320 Q1020 300 1220 330" stroke="url(#f1)" stroke-width="1.4" fill="none"/>
  <path d="M-20 335 Q180 305 400 338 Q660 372 900 340 Q1060 315 1220 355" stroke="url(#f1)" stroke-width="0.9" fill="none"/>
  <path d="M-20 358 Q220 328 460 358 Q720 390 960 358 Q1100 335 1220 375" stroke="url(#f3)" stroke-width="0.7" fill="none"/>
  <path d="M-20 390 Q300 360 560 390 Q800 420 1040 388 Q1140 370 1220 400" stroke="url(#f2)" stroke-width="1.2" fill="none"/>
  <path d="M-20 415 Q280 385 540 415 Q820 448 1080 415 Q1160 395 1220 425" stroke="url(#f2)" stroke-width="0.8" fill="none"/>

  <!-- Microscopy precision rings — right side -->
  <circle cx="980" cy="210" r="110" fill="none" stroke="#3BAEC4" stroke-width="0.6" opacity="0.16"/>
  <circle cx="980" cy="210" r="80" fill="none" stroke="#3BAEC4" stroke-width="0.8" opacity="0.22"/>
  <circle cx="980" cy="210" r="50" fill="none" stroke="#3BAEC4" stroke-width="1.0" opacity="0.32"/>
  <circle cx="980" cy="210" r="22" fill="none" stroke="#3BAEC4" stroke-width="1.2" opacity="0.48"/>
  <circle cx="980" cy="210" r="7" fill="#3BAEC4" opacity="0.80"/>
  <circle cx="980" cy="210" r="3" fill="white" opacity="0.70"/>

  <!-- Crosshair -->
  <line x1="862" y1="210" x2="1098" y2="210" stroke="#3BAEC4" stroke-width="0.5" opacity="0.25"/>
  <line x1="980" y1="92" x2="980" y2="328" stroke="#3BAEC4" stroke-width="0.5" opacity="0.25"/>

  <!-- Tick marks on outer ring -->
  <line x1="980" y1="98" x2="980" y2="112" stroke="#3BAEC4" stroke-width="1.2" opacity="0.40"/>
  <line x1="980" y1="308" x2="980" y2="322" stroke="#3BAEC4" stroke-width="1.2" opacity="0.40"/>
  <line x1="868" y1="210" x2="882" y2="210" stroke="#3BAEC4" stroke-width="1.2" opacity="0.40"/>
  <line x1="1078" y1="210" x2="1092" y2="210" stroke="#3BAEC4" stroke-width="1.2" opacity="0.40"/>

  <!-- 45-degree ticks -->
  <line x1="900" y1="130" x2="910" y2="140" stroke="#3BAEC4" stroke-width="0.8" opacity="0.28"/>
  <line x1="1050" y1="130" x2="1060" y2="140" stroke="#3BAEC4" stroke-width="0.8" opacity="0.28"/>
  <line x1="900" y1="280" x2="910" y2="290" stroke="#3BAEC4" stroke-width="0.8" opacity="0.28"/>
  <line x1="1050" y1="280" x2="1060" y2="290" stroke="#3BAEC4" stroke-width="0.8" opacity="0.28"/>

  <!-- Spectral analysis curve (like FTIR/XRD data) -->
  <path d="M820 500 L840 498 L855 496 L865 492 L872 485 L878 470 L882 455 L886 440 L890 445 L894 460 L898 470 L905 472 L920 470 L935 468 L945 462 L952 452 L956 445 L960 450 L965 460 L972 465 L985 464 L1000 462 L1020 460 L1040 458 L1060 456 L1080 454 L1100 453 L1120 452 L1140 451 L1160 450" stroke="#3BAEC4" stroke-width="1.5" fill="none" opacity="0.40"/>

  <!-- Satellite molecules near the rings -->
  <circle cx="840" cy="150" r="3.5" fill="#3BAEC4" opacity="0.55"/>
  <circle cx="870" cy="118" r="2.5" fill="#8ABFB2" opacity="0.42"/>
  <line x1="840" y1="150" x2="870" y2="118" stroke="#3BAEC4" stroke-width="0.5" opacity="0.28"/>

  <circle cx="1100" cy="295" r="3" fill="#692BBA" opacity="0.55"/>
  <circle cx="1140" cy="320" r="2" fill="#692BBA" opacity="0.40"/>
  <line x1="1100" y1="295" x2="1140" y2="320" stroke="#692BBA" stroke-width="0.5" opacity="0.28"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.045)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Brand line top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#brand)"/>

  <!-- Category badge -->
  <rect x="72" y="60" width="120" height="26" rx="13" fill="rgba(59,174,196,0.15)" stroke="#3BAEC4" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="132" y="77" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3BAEC4" text-anchor="middle" letter-spacing="1.2">LABORATÓRIO</text>

  <!-- Date -->
  <text x="72" y="115" font-family="Inter, sans-serif" font-size="13" fill="rgba(138,191,178,0.72)" letter-spacing="0.3">8 de junho de 2026</text>

  <!-- Main headline -->
  <text x="72" y="178" font-family="Sora, sans-serif" font-size="46" font-weight="800" fill="white" letter-spacing="-1.2">Primeiro equipamento</text>
  <text x="72" y="234" font-family="Sora, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#3BAEC4">do laboratório</tspan><tspan fill="white"> chega</tspan>
  </text>
  <text x="72" y="290" font-family="Sora, sans-serif" font-size="46" font-weight="800" fill="white" letter-spacing="-1.2">à USP São Carlos</text>

  <!-- Divider line -->
  <rect x="72" y="314" width="220" height="2" rx="1" fill="url(#brand)"/>

  <!-- Subtitle -->
  <text x="72" y="352" font-family="Inter, sans-serif" font-size="16" fill="rgba(255,255,255,0.60)" letter-spacing="0.1">Início concreto da infraestrutura experimental</text>
  <text x="72" y="375" font-family="Inter, sans-serif" font-size="16" fill="rgba(255,255,255,0.60)" letter-spacing="0.1">do INTERFIBRAS no SMM-EESC-USP.</text>

  <!-- Badges -->
  <rect x="72" y="415" width="180" height="38" rx="19" fill="rgba(59,174,196,0.10)" stroke="#3BAEC4" stroke-width="1" stroke-opacity="0.38"/>
  <text x="162" y="438" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#3BAEC4" text-anchor="middle" letter-spacing="0.8">Projeto FAPESP JP</text>

  <rect x="264" y="415" width="165" height="38" rx="19" fill="rgba(105,43,186,0.10)" stroke="#692BBA" stroke-width="1" stroke-opacity="0.35"/>
  <text x="346" y="438" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#b785f5" text-anchor="middle" letter-spacing="0.8">EESC-USP · São Carlos</text>

  <!-- Footer -->
  <text x="72" y="590" font-family="Sora, sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.22)" letter-spacing="2">interfibras.usp.br</text>
</svg>
