<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072524"/>
      <stop offset="55%" stop-color="#0c3330"/>
      <stop offset="100%" stop-color="#0f2a4a"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4BAF92" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4BAF92" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4BAF92" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#692BBA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#692BBA" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#692BBA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ABFB2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8ABFB2" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8ABFB2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4BAF92"/>
      <stop offset="100%" stop-color="#692BBA"/>
    </linearGradient>
    <radialGradient id="orb1" cx="25%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#4BAF92" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4BAF92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="78%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#692BBA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#692BBA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4BAF92" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4BAF92" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4BAF92" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur40">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur15">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Orbs -->
  <ellipse cx="300" cy="283" rx="340" ry="340" fill="url(#orb1)" filter="url(#blur40)"/>
  <ellipse cx="936" cy="347" rx="280" ry="280" fill="url(#orb2)" filter="url(#blur40)"/>

  <!-- Dawn glow behind network -->
  <ellipse cx="980" cy="210" rx="220" ry="160" fill="url(#dawn)" filter="url(#blur15)"/>

  <!-- Fiber filaments -->
  <path d="M-20 310 Q200 280 420 315 Q640 350 860 320 Q1020 300 1220 330" stroke="url(#f1)" stroke-width="1.4" fill="none"/>
  <path d="M-20 335 Q180 305 400 338 Q660 372 900 340 Q1060 315 1220 355" stroke="url(#f1)" stroke-width="0.9" fill="none"/>
  <path d="M-20 358 Q220 328 460 358 Q720 390 960 358 Q1100 335 1220 375" stroke="url(#f3)" stroke-width="0.7" fill="none"/>
  <path d="M-20 390 Q300 360 560 390 Q800 420 1040 388 Q1140 370 1220 400" stroke="url(#f2)" stroke-width="1.2" fill="none"/>
  <path d="M-20 415 Q280 385 540 415 Q820 448 1080 415 Q1160 395 1220 425" stroke="url(#f2)" stroke-width="0.8" fill="none"/>

  <!-- Expanding network — radiating group formation -->
  <!-- Central hub -->
  <circle cx="980" cy="205" r="11" fill="#4BAF92" opacity="0.92"/>
  <circle cx="980" cy="205" r="22" fill="none" stroke="#4BAF92" stroke-width="1.2" opacity="0.42"/>
  <circle cx="980" cy="205" r="38" fill="none" stroke="#4BAF92" stroke-width="0.6" opacity="0.22"/>
  <circle cx="980" cy="205" r="60" fill="none" stroke="#4BAF92" stroke-width="0.4" opacity="0.12"/>

  <!-- Ring 1 nodes — first circle of connections -->
  <line x1="980" y1="205" x2="1055" y2="148" stroke="#4BAF92" stroke-width="0.9" opacity="0.52"/>
  <circle cx="1055" cy="148" r="5.5" fill="#4BAF92" opacity="0.80"/>
  <circle cx="1055" cy="148" r="13" fill="none" stroke="#4BAF92" stroke-width="0.6" opacity="0.28"/>

  <line x1="980" y1="205" x2="1100" y2="205" stroke="#8ABFB2" stroke-width="0.9" opacity="0.45"/>
  <circle cx="1100" cy="205" r="4.5" fill="#8ABFB2" opacity="0.72"/>
  <circle cx="1100" cy="205" r="11" fill="none" stroke="#8ABFB2" stroke-width="0.5" opacity="0.25"/>

  <line x1="980" y1="205" x2="1055" y2="268" stroke="#692BBA" stroke-width="0.9" opacity="0.48"/>
  <circle cx="1055" cy="268" r="5" fill="#692BBA" opacity="0.78"/>
  <circle cx="1055" cy="268" r="13" fill="none" stroke="#692BBA" stroke-width="0.6" opacity="0.25"/>

  <line x1="980" y1="205" x2="905" y2="268" stroke="#8ABFB2" stroke-width="0.9" opacity="0.42"/>
  <circle cx="905" cy="268" r="4" fill="#8ABFB2" opacity="0.68"/>

  <line x1="980" y1="205" x2="905" y2="148" stroke="#692BBA" stroke-width="0.9" opacity="0.40"/>
  <circle cx="905" cy="148" r="4.5" fill="#692BBA" opacity="0.65"/>
  <circle cx="905" cy="148" r="11" fill="none" stroke="#692BBA" stroke-width="0.5" opacity="0.22"/>

  <!-- Ring 2 nodes — second circle -->
  <line x1="1055" y1="148" x2="1148" y2="105" stroke="#4BAF92" stroke-width="0.6" opacity="0.30"/>
  <circle cx="1148" cy="105" r="3" fill="#4BAF92" opacity="0.55"/>

  <line x1="1055" y1="148" x2="1140" y2="165" stroke="#8ABFB2" stroke-width="0.5" opacity="0.26"/>
  <circle cx="1140" cy="165" r="2.5" fill="#8ABFB2" opacity="0.48"/>

  <line x1="1055" y1="268" x2="1148" y2="305" stroke="#692BBA" stroke-width="0.6" opacity="0.30"/>
  <circle cx="1148" cy="305" r="3" fill="#692BBA" opacity="0.52"/>

  <line x1="905" y1="148" x2="850" y2="100" stroke="#692BBA" stroke-width="0.5" opacity="0.26"/>
  <circle cx="850" cy="100" r="2.5" fill="#692BBA" opacity="0.48"/>

  <line x1="1100" y1="205" x2="1160" y2="240" stroke="#8ABFB2" stroke-width="0.5" opacity="0.25"/>
  <circle cx="1160" cy="240" r="2" fill="#8ABFB2" opacity="0.42"/>

  <!-- Cross connections between nodes -->
  <line x1="1055" y1="148" x2="1100" y2="205" stroke="#4BAF92" stroke-width="0.4" opacity="0.22"/>
  <line x1="1055" y1="268" x2="1100" y2="205" stroke="#692BBA" stroke-width="0.4" opacity="0.20"/>
  <line x1="905" y1="148" x2="905" y2="268" stroke="#8ABFB2" stroke-width="0.4" opacity="0.18"/>

  <!-- Small floating molecules left side -->
  <circle cx="80" cy="480" r="3" fill="#4BAF92" opacity="0.40"/>
  <circle cx="140" cy="510" r="2" fill="#692BBA" opacity="0.35"/>
  <circle cx="105" cy="540" r="2.5" fill="#8ABFB2" opacity="0.30"/>
  <line x1="80" y1="480" x2="140" y2="510" stroke="#4BAF92" stroke-width="0.5" opacity="0.25"/>
  <line x1="140" y1="510" x2="105" y2="540" stroke="#8ABFB2" stroke-width="0.5" opacity="0.22"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.045)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Brand line top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#brand)"/>

  <!-- Category badge -->
  <rect x="72" y="60" width="82" height="26" rx="13" fill="rgba(75,175,146,0.15)" stroke="#4BAF92" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="113" y="77" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4BAF92" text-anchor="middle" letter-spacing="1.2">GRUPO</text>

  <!-- Date -->
  <text x="72" y="115" font-family="Inter, sans-serif" font-size="13" fill="rgba(138,191,178,0.72)" letter-spacing="0.3">12 de junho de 2026</text>

  <!-- Main headline -->
  <text x="72" y="178" font-family="Sora, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#4BAF92">INTERFIBRAS</tspan><tspan fill="white"> inicia</tspan>
  </text>
  <text x="72" y="234" font-family="Sora, sans-serif" font-size="46" font-weight="800" fill="white" letter-spacing="-1.2">suas atividades</text>
  <text x="72" y="290" font-family="Sora, sans-serif" font-size="46" font-weight="800" fill="white" letter-spacing="-1.2">na USP São Carlos</text>

  <!-- Divider line -->
  <rect x="72" y="314" width="220" height="2" rx="1" fill="url(#brand)"/>

  <!-- Subtitle -->
  <text x="72" y="352" font-family="Inter, sans-serif" font-size="16" fill="rgba(255,255,255,0.60)" letter-spacing="0.1">O grupo começa oficialmente como Projeto</text>
  <text x="72" y="375" font-family="Inter, sans-serif" font-size="16" fill="rgba(255,255,255,0.60)" letter-spacing="0.1">Jovem Pesquisador FAPESP no SMM-EESC-USP.</text>

  <!-- Badges -->
  <rect x="72" y="415" width="230" height="38" rx="19" fill="rgba(75,175,146,0.10)" stroke="#4BAF92" stroke-width="1" stroke-opacity="0.38"/>
  <text x="187" y="438" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8ABFB2" text-anchor="middle" letter-spacing="1.0">Processo FAPESP 2023/03039-7</text>

  <rect x="316" y="415" width="165" height="38" rx="19" fill="rgba(105,43,186,0.10)" stroke="#692BBA" stroke-width="1" stroke-opacity="0.35"/>
  <text x="398" y="438" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#b785f5" text-anchor="middle" letter-spacing="0.8">EESC-USP · São Carlos</text>

  <!-- Footer -->
  <text x="72" y="590" font-family="Sora, sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.22)" letter-spacing="2">interfibras.usp.br</text>
</svg>
